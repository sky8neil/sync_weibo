<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>双发小助手</title>
<style>
  body { width: 428px; box-sizing: border-box; margin: 0; padding: 12px 14px 10px; font: 14px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; }
  h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff8a00; box-shadow: 9px 0 0 #2f6fe0, 18px 0 0 #111; margin: 0 22px 0 2px; }
  textarea { width: 100%; box-sizing: border-box; height: 96px; padding: 9px; border: 1px solid #d0d5dd; border-radius: 8px; resize: none; font: inherit; }
  textarea:focus { outline: 2px solid #93b4f5; border-color: transparent; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .hint { font-size: 12px; color: #667085; }
  #counter { font-size: 12px; color: #667085; white-space: nowrap; }
  #counter.warn { color: #b45309; }
  #counter.over { color: #c0281e; font-weight: 600; }
  #tags { flex: 1; padding: 7px 9px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit; font-size: 13px; }
  #tags:focus { outline: 2px solid #93b4f5; border-color: transparent; }
  .minibtn { border: 1px solid #d0d5dd; background: #f8fafc; border-radius: 8px; padding: 7px 10px; font: 600 12.5px/1 inherit; cursor: pointer; color: #334155; white-space: nowrap; }
  .minibtn:hover { background: #eef2f7; }
  #thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .thumb { position: relative; width: 56px; height: 56px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #e4e7ec; display: block; }
  .thumb .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #c0281e; color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }
  .thumb .sz { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9px; color: #fff; background: rgba(0,0,0,.45); border-radius: 0 0 8px 8px; text-align: center; }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .actions button { flex: 1; padding: 10px 0; border: 0; border-radius: 9px; font: 600 13px/1 inherit; cursor: pointer; color: #fff; transition: filter .15s; }
  .actions button:hover { filter: brightness(1.08); }
  .actions button:disabled { opacity: .55; cursor: default; filter: none; }
  #sendFanfou { background: #ff8a00; }
  #sendAkkoma { background: #2f6fe0; }
  #sendTwitter { background: #111111; }
  #sendAkTw { background: linear-gradient(90deg, #2f6fe0, #111111); }
  #sendAll { background: linear-gradient(90deg, #ff8a00, #2f6fe0 50%, #111111); }
  #statusbar { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; background: #f4f6f8; color: #475467; min-height: 18px; }
  #statusbar.sending { background: #eff6ff; color: #1d4ed8; }
  #statusbar.success { background: #ecfdf3; color: #067647; }
  #statusbar.error { background: #fef3f2; color: #b42318; }
  #statusbar .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  #statusbar a { color: inherit; }
  .logsec { margin-top: 10px; border: 1px solid #e4e7ec; border-radius: 8px; overflow: hidden; }
  .loghead { display: flex; justify-content: space-between; padding: 6px 10px; background: #f8fafc; font-size: 12px; color: #475467; }
  .loghead a { color: #2f6fe0; cursor: pointer; text-decoration: none; }
  #log { max-height: 118px; overflow-y: auto; padding: 4px 10px; font-size: 12px; }
  #log .item { padding: 3px 0; border-bottom: 1px dashed #eef2f7; word-break: break-all; }
  #log .item:last-child { border-bottom: 0; }
  #log .ok { color: #067647; }
  #log .bad { color: #b42318; }
  #log .time { color: #98a2b3; margin-right: 4px; }
  .foot { margin-top: 10px; font-size: 12px; color: #667085; display: flex; justify-content: space-between; }
  .foot a { color: #2f6fe0; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
  <h1><span class="dot"></span>双发小助手</h1>
  <textarea id="msg" placeholder="写点什么，然后选择发给谁…" autofocus></textarea>

  <div class="row">
    <span id="counter">0 字</span>
    <span id="counterHint" class="hint"></span>
  </div>

  <div class="row">
    <input id="tags" placeholder="标签（空格分隔，加给 Akkoma / X）">
    <button id="tagBtn" class="minibtn" title="把标签以 # 形式插入正文末尾（所有平台可见）">##</button>
  </div>

  <div class="row">
    <button id="addImg" class="minibtn">🖼 添加图片</button>
    <span id="imgInfo" class="hint">配图：饭否 1 / Akkoma 16 / X 4 张 · 自动压 webp</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>
  <div id="thumbs"></div>

  <div class="actions">
    <button id="sendFanfou">发饭否</button>
    <button id="sendAkkoma">发 Akkoma</button>
    <button id="sendTwitter">发 Twitter</button>
  </div>
  <div class="actions" style="margin-top:8px">
    <button id="sendAkTw">Akkoma + X</button>
    <button id="sendAll">同时发（3 平台）</button>
  </div>

  <div id="statusbar">待发送</div>

  <div class="logsec">
    <div class="loghead"><span>日志（发送记录 / 报错）</span><a id="clearLog">清空</a></div>
    <div id="log"></div>
  </div>

  <div class="foot">
    <span id="cfgHint"></span>
    <a id="openOptions">设置 ⚙</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
